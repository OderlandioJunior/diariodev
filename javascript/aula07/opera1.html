<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores</title>
</head>
<body>
    <script>
        /*
        Operadores aritméticos
        + = adição
        - = subtração
        * = multiplicação
        / = divisão com números reais (números com casas decimais // com virgulas)
        % = resto de divisão (sem casas decimais // resultado da divisião forçando a não ter vírgula)
        ** = potênciação
        Em uma conta com vários operadores, para mudar a ordem de precedência da matemática básica, usamos (). Por exemplo: 5 + 3 / 2 = 6,5 => (5 + 3) / 2 = 4
        */

        /*
        A ordem da precedência:
        - () = preferência máxima na soma dentro de parenteses
        - **
        - *, / e %
        - + e -
        */

        /*
        Auto-atribuições
        Numa auto-atribuição acontece quando uma variável já tem um valor e o valor é substituído automaticamente, por exemplo:
        var n = 3 // variável n tem como valor 3
        n = n + 4 // n3 + 4 é igual a 7, logo esse novo valor é atribuido na variável n, ou seja, agora o valor de n não é mais 3 e sim 7 por conta da soma. E isso vale para todas as expressões matemáticas
        Quando em casos que a variável será atribuida a uma expressão, podemos simplificar a expressão de:
        n = n + 3 para n += 4
        */

        /*
        Incrementos
        Quando temos uma expressão somando "num = num + 1" temos a simplificação para "num += 1"
        Porém numa situação onde teremos que repetir várias vezes essa simplificação, podemos usar o num++, que é demoninado como "pós-incremento" // válido para qualquer operador numa expressão onde a variável sera afetada para ela mesma no valor 1.
        Assim como também temos o "pré-incremento", que nada mais é do que inverter a posição dos operadores na expressão, por exemplo: de num++ para ++num 
        // Vale lembrar que incremento salva o histórico primeiro, faz a conta depois e pré-incremento faz a conta primeiro, atualiza todo mundo depois.
        */
    </script>
</body>
</html>
