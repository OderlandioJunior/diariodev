<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entendendo JS</title>
    <style>
        body {
            background-color: rgb(105, 105, 173);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: rgb(255, 212, 22);
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        /* A ordem afeta, igual nas CSS */
        /*
        Variáveis são dados coletados que podem ser escritas como:
        > var:
        > let:
        > const:
        */
        var nome = window.prompt('Qual é o seu nome?');
        /*
        Um sinal de = significa "recebe"
        Quando uma variavel receber um valor, essa ação tem o nome de "Atribuição"
        >> Nesse contexto, a variável nome está recebendo o valor de prompt
        */
        /*
        Identificadores é um nome referente ao dado da variável, por exemplo: var nome = Júnior
        - Podemos usar letras, acentos e simbolos ($ / _)
        - Não pode começar com número ou palavras reservadas do próprio JS e nem ter espaços
        */
        window.alert('É um grande prazer te conhecer, ' + nome);
        /*
        Um sinal de + entre string serve para unir os elementos, essa ação tem o nome de "Concatenação"
        */
    </script>
</body>
</html>
