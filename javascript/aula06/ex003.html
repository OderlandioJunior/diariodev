<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre string e number</title>
    <style>
        body {
            background-color: rgb(105, 105, 173);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: rgb(255, 212, 22);
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        /*
        Tipos de primitivos primordiais das variaveis: 
        > number: numeros inteiros e reais (5, -12, 3.14)

        > string: palavras em geral escrita dentro de ", ' e ` (aspas duplas e aspas simples para strings simples // crase para string com um conjunto de variáveis dentro de ${}, chamadas de templates strings) e/ou conjunto de números (ex.: CPF/CEP)

        > boolean: valores como true e false
        */
        var n1 = Number(window.prompt('Digite um número:'));
        var n2 = Number(window.prompt('Digite outro número:'));
        var s = n1 + n2;
        /*
        Um sinal de + entre Number tem como valor a adição de dois números
        */
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`);
        /*
        Conversão de variável:
        string > number
        Number() //detecção automática
        Number.parseInt() //inteiros
        Number.parseFloat() //reais

        number > string
        String()
        .toString() //Deve ser colocado depois do identificador
        */
    </script>
</body>
</html>
