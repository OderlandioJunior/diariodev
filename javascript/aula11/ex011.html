<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de condições</title>
</head>
<body>
    
    <script>
        /*
        Um desvio condicional é uma instrução que permite ao programa tomar decisões e alterar seu caminho de execução com base no resultado de um teste lógico
        */
        /*
        Condicional Simples (if = se): Executa uma ação apenas se a condição for verdadeira. Se for falsa, o programa simplesmente ignora o bloco.
        Exemplo: *Se* a senha estiver correta, permitir o login
        */
        /*
        Condicional Composta (if = se / else = senão): Permite definir um caminho para quando a condição for verdadeira e um caminho alternativo (o "senão") para quando ela for falsa.
        Exemplo: *Se* o semáforo estiver verde, atravesse; *senão*, aguarde.
        */
    </script>
</body>
</html>
