<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições Multiplas</title>
</head>
<body>
    <h1>Que dia é hoje?</h1>
    <div id="mostrar"></div>

    <script>
        var dia = new Date();
        var diaSem = dia.getDay();
        var mostrar = document.getElementById('mostrar');
        var nomeDia = '';
        switch(diaSem) {
            case 0:
                nomeDia = 'Domingo'
            break
            case 1:
                nomeDia = 'Segunda-feira'
            break
            case 2:
                nomeDia = 'Terça-feira'
            break
            case 3:
                nomeDia = 'Quarta-feira'
            break
            case 4:
                nomeDia = 'Quinta-feira'
            break
            case 5:
                nomeDia = 'Sexta-feira'
            break
            case 6:
                nomeDia = 'Sábado'
            break
        }
        mostrar.innerHTML = `<p>Hoje é <strong>${nomeDia}</strong>!</p>`;
    </script>
</body>
</html>
