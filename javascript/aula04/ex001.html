<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(105, 105, 173);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: rgb(255, 212, 22);
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição</p>
    <script>
        /* A ordem afeta, igual nas CSS */
        window.alert('Minha primeira mensagem');
        window.confirm('Esta gostando de JavaScript?');
        window.prompt('Qual é o seu nome?');

        /*
        Um sinal de = significa "recebe"
        "Atribuição" significa colocar os valores das variáveis dentro da memória
        "Concatenação" significa unir elementos, é feita através do sinal + entre duas strings
        */

        /*
        Variáveis são dados coletados que podem ser escritas como:
        > var:
        > let:
        > const:
        */

        /*
        Identificadores é um nome referente ao dado da variável, por exemplo: var idade = 35
        - Não pode começar com número ou palavras reservadas do próprio JS e nem ter espaços
        - Podemos usar letras, acentos e simbolos ($ / _)
        */

        /*
        Tipos de primitivos primordiais das variaveis: 
        > number: numeros inteiros e reais (5, -12, 3.14)
        > string: palavras em geral escrita dentro de ", ' e ` (aspas duplas, aspas simples e crase (string dentro de crase podem sofrer inserção de template string, que é um conjunto de variáveis dentro de ${})) e/ou conjunto de números (ex.: CPF/CEP)
        > boolean: valores como true e false
        */

        /*
        Conversão de variável:
        string > number
        Number.parseInt() //inteiros
        Number.parseFloat() //reais
        Number() //detecção automática

        number > string
        String()
        .toString() //Deve ser colocado depois do identificador
        */
    </script>
</body>
</html>
