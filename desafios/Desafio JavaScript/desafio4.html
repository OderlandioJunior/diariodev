<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo troco</title>
    <style>
        input {                
            padding: 2%;
            border-radius: 10px;
            font: normal 15pt arial;
            transition: background .5s ease-out;
        }
        input:hover {
            cursor: pointer;
            text-decoration: underline;
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>Calculando o Troco</h1>
    <input type="button" value="Comprar produto" onclick="precisaTroco()">

    <script>
        function precisaTroco() {
            var produto = window.prompt('Que produto você esta comprando?')
            var valor = Number(window.prompt(`Digite o valor do ${produto} que você está comprando`));
            var pagou = Number(window.prompt(`Quanto você pagou pelo ${produto}?`));
            var troco = pagou - valor;
            if (pagou > valor) {
                window.alert(`Você está comprando um ${produto}, que custou R$ ${valor},00. Você pagou R$ ${pagou},00 e precisa receber R$ ${troco},00 de troco!`);
            }else if(pagou < valor) {
                window.alert(`Seu saldo é insuficiente, pois você está pagando R$ ${pagou},00 em um ${produto} que custa R$ ${valor},00! Por favor, verifique seu banco`);
            }else {
                window.alert(`Parabens pela sua compra, receba o ${produto}!`);
            }
        }
    </script>
</body>
</html>
