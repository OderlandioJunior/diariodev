<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-vindas</title>
    <style>
        input {
                margin-left: 10px;
                padding: 8%;
                border-radius: 15px;
                font: normal 15pt arial;
                transition: background .5s ease-out;
            }
            input:hover {
                cursor: pointer;
                text-decoration: underline;
                background-color: gray;
            }
    </style>
</head>
<body>
    <h1>Desafio boas-vindas</h1>
    <input type="button" value="Iniciar o desafio" onclick="conhecer()">

    <script>
        function conhecer() {
            var nomeDigitado = window.prompt('Qual é o seu nome?');
            var idadeDigitada = window.prompt('Quantos anos você tem?');

            window.alert(`Acabei de conhecer ${nomeDigitado} que tem ${idadeDigitada} anos de idade!`)
        }
    </script>
</body>
</html>
