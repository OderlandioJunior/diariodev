<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ano Bissexto</title>
    <style>
        body {
                font: normal 15pt arial;
            }
            input {
                font: normal 15pt arial;
                padding: 15px;
                border-radius: 10px;
            }
    </style>
</head>
<body>
    <h1>Ano Bissexto</h1>
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="resultado">
        <p>Informe um ano para saber se ele é bissexto</p>
    </div>

    <script>
        function verificar() {
            var ano = prompt('Qual é o ano que você quer verificar?');
            var exibirTela = document.querySelector('div#resultado');
            var textoFinal = `<h2>Analisando o ano de ${ano}...</h2> <p>O ano de ${ano}`

            if ((ano % 4 == 0 && ano % 100 != 0) || ano % 400 == 0) {
                textoFinal+=' <mark style="background-color: green;">É BISSEXTO</mark></p>'
            } else {
                textoFinal+=' <mark style="background-color: red;">NÃO É BISSEXTO</mark></p>'
            }
            exibirTela.innerHTML = textoFinal
        }
    </script>
</body>
</html>
