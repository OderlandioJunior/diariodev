<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Verificador de Idade</title>

</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <p>Ano de Nascimento: <label for="ano"><input type="number" name="ano" id="ano"></label></p>
            <p>Sexo: <label for="masc"><input type="radio" name="opcaoSexo" id="masc">Masculino</label> <label for="fem"><input type="radio" name="opcaoSexo" id="fem">Feminino</label></p>
            <input type="button" value="Verificar" onclick="verificar()">
        </div>
        <div id="resultado">
            <p>Preencha os dados acima para ver o resultado!</p>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
