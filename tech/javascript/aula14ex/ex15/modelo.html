<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Tabuada</h1>
    </header>
    <section>
        <div>
            <p><label for="fator">Número: <input type="number" name="fator" id="fator"></label> <input type="button" value="Gerar tabuada" onclick="tabuada()"></p>
        </div>
        <select id="tabuadaSelect">
        </select>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script>
        var inputNumero = document.querySelector('#fator')
        var mostrarTabuada = document.querySelector('#tabuadaSelect')

        function tabuada() {
            var numeroMultiplicando = Number(inputNumero.value)

            if (inputNumero.value == '') {
            window.alert('Preencha os campos corretamente e tente novamente.')
            } else {
                mostrarTabuada.innerHTML = ''
                for (var i = 0; i <= 10; i++) {
                    var resultado = numeroMultiplicando * i
                    mostrarTabuada.innerHTML += `<option>${numeroMultiplicando}x${i} = ${resultado}</option> `
                }
            }
        }
    </script>
</body>
</html>
