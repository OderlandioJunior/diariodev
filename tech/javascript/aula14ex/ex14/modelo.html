<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div id="main">
            <p><label for="start">Inicio: <input type="number" name="start" id="start"></label></p>
            <p><label for="end">Fim: <input type="number" name="end" id="end"></label></p>
            <p><label for="step">Passo: <input type="number" name="step" id="step"></label></p>
            <input type="button" value="Contar" onclick="contar()">
            <p>Preparando a contagem...</p>
        </div>
        <div id="resultado">
            <p id="contagem"></p>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script>
        // Seletores
        var inputInicio = document.querySelector('#start')
        var inputFim = document.querySelector('#end')
        var inputPasso = document.querySelector('#step')
        var mostrarTela = document.querySelector('#resultado')
        var contador = document.querySelector('#contagem')

        function contar(){
            //Conversores
            var inicioValor = Number(inputInicio.value)
            var fimValor = Number(inputFim.value)
            var passoValor = Number(inputPasso.value)
            if (inputInicio.value === "" || inputFim.value === "" || inputPasso.value === "" || fimValor < inicioValor){
                window.alert('Preencha os campos corretamente e tente novamente.')
            } else if (passoValor === 0) {
                window.alert('Impossível contar com o passo 0! Considerando o passo como 1');
                mostrarTela.innerHTML = "Contando:" 
                for (inicioValor; inicioValor <= fimValor; inicioValor = inicioValor + 1) {
                    mostrarTela.innerHTML += `👉 ${inicioValor} `;
                }
                mostrarTela.innerHTML += "🚩"
            } else {
                mostrarTela.innerHTML = "Contando:"
                    for (var num = inicioValor; num <= fimValor; num += passoValor) {
                        mostrarTela.innerHTML += num + "&#128073;"
                    }
                mostrarTela.innerHTML += "🚩"
            }
        }
    </script>
</body>
</html>
