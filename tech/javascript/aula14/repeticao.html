<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetição JavaScript</title>
</head>
<body>
    <script>
        /*
        Estrutura de repetição com variável de controle
        Essa estrutura é dividida em 3 partes,sendo a Inicialização,  o Teste lógico e o Incremento (soma)
        Sua ação ocorre quando o teste lógico for verdadeiro, a estrutura fará o bloco "{}" e no momento da repetição faz o incremento (soma), depois retorna para o inicio da estrutura e refaz o processo partindo com as 3 partes novamente, inicialização, teste lógico e soma enquanto o teste lógico for verdadeiro, caso contrário ele encerra a repetição e segue o fluxo do programa

        for(inicio; teste; incremento) {

        }
        Ex: for(var c = 1; c <= 10; c++) {

        }
        */
    </script>
</body>
</html>
