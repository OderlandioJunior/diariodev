<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de number</title>
</head>
<body>
    
    <script>
        var n1 = 1530.5;
        n1.toFixed(2) //Adiciona casas decimais (2 casas)
        n1.toFixed(2).replace('.',',') // Troca o . por ,
        n1.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) //Diz ao navegador a moeda do valor inserido na variável
        document.write(n1);

        /*
        Conversão de variável:
        string > number
        Number() //detecção automática
        Number.parseInt() //inteiros
        Number.parseFloat() //reais
        // Toda caixa digitável é considerada STRING
        var n1 = Number(window.prompt('Digite um número:'));
        var n2 = Number(window.prompt('Digite outro número:'));
        var s = n1 + n2;
        */
    </script>
</body>
</html>
