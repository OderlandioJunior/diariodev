<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Analisador de Números</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section>
        <div>
            <p><label for="txtnum">Digite um número de 1 a 100:</label> <input type="number" name="txtnum" id="txtnum"><input type="button" value="Adicionar" onclick="adicionar()"></p>
        </div>
        <select id="numeroSelect" size="5" style="width: 150px;"></select> <input type="button" value="Finalizar" onclick="finalizar()">
        <div id="resultado">

        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script>
        const mostrarTela = document.querySelector('#resultado');
        const inputNumero = document.querySelector('#txtnum');
        const selecionarNumero = document.querySelector('#numeroSelect');
        let guardarNumero = []

        function adicionar() {
            const converterNumero = Number(inputNumero.value);

            if (inputNumero.value == '' || converterNumero > 100 || converterNumero < 1) {
                window.alert('Preencha os campos corretamente e tente novamente.') 
            } else if (guardarNumero.indexOf(converterNumero) != -1) {
                    window.alert('Número já encontrado, tente novamente.')
                } else {
                    guardarNumero.push(converterNumero)
                    selecionarNumero.innerHTML += `<option>Valor ${converterNumero} adicionado.</option>`
                    inputNumero.value = ''
                }
        }
        function finalizar() {
            if (guardarNumero.length == 0) {
                window.alert('Adicione valores antes de finalizar!')
                return
            }
            let maiorNumero = guardarNumero[0];
            let menorNumero = guardarNumero[0];
            let soma = guardarNumero[0];
            for (let i = 1; i < guardarNumero.length; i++) {
                if (guardarNumero[i] > maiorNumero) {
                    maiorNumero = guardarNumero[i];
                }
                if (guardarNumero[i] < menorNumero) {
                    menorNumero = guardarNumero[i];
                }
                soma += guardarNumero[i];
            }
            let media = soma / guardarNumero.length;

            mostrarTela.innerHTML = `
            <p>Ao todo, temos ${guardarNumero.length} números cadastrados.</p> 
            <p>O maior numero cadastrado foi ${maiorNumero}</p> 
            <p>O menor número cadastrado foi ${menorNumero}</p>
            <p>Somando todos os valores, temos ${soma}.</p> 
            <p>A média dos valores digitados é ${media.toFixed(1)}.</p`
        }
    </script>
</body>
</html>
