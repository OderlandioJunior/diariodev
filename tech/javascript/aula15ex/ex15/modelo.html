<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Analisador de Números</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section>
        <div>
            <p><label for="txtnum">Digite um número de 1 a 100:</label> <input type="number" name="txtnum" id="txtnum"><input type="button" value="Adicionar" onclick="adicionar()"></p>
        </div>
        <select id="numeroSelect" size="5" style="width: 150px;"></select> <input type="button" value="Finalizar" onclick="finalizar()">
        <div id="resultado">

        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script>
        const inputNumero = document.querySelector('#txtnum');
        let converterNumero = Number(inputNumero.value)
        const selecionarNumero = document.querySelector('#numeroSelect')
        let guardarNumero = []

        function adicionar() {
            if (inputNumero == '' || inputNumero.value > 100 || inputNumero.value < 1) {
                window.alert('Preencha os campos corretamente e tente novamente.') 
            } else if (guardarNumero.indexOf(inputNumero.value) != -1) {
                window.alert('Número já encontrado, tente novamente.')
                } else {
                guardarNumero.push(inputNumero.value)
                selecionarNumero.innerHTML += `<option>Valor ${inputNumero.value} adicionado.</option>`
                inputNumero.value = ''
            }
        }
        function finalizar() {
            const mostrarTela = document.querySelector('#resultado')
            mostrarTela.innerHTML += `<p>Ao todo, temos ${guardarNumero.length} números cadastrados.</p>`
            
            /* let maiorNumero
            let menorNumero
            let soma
            let media */
            //<p>O maior número informado foi ${guardarNumero[pos]}.</p> <p>O menor número informado foi ${menorNumero}.</p> <p>Somando todos os valores, temos ${soma}.</p> <p>A média dos valores digitados é ${media}.</p>`
        }
    </script>
</body>
</html>
