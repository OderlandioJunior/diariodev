<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições Simples</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    <label for="txtvel">Velocidade do carro:</label> <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Enviar" onclick="calcular()">
    <div id="res"></div>
    
    <script>
        function calcular() {
            var txtv = document.querySelector('input#txtvel');
            var vel = Number(txtv.value);
            var res = document.querySelector('div#res');
            res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}</strong> Km/h</p>`
            if (vel > 60) {
                res.innerHTML +='<p>Você está <strong>multado</strong> por excesso de velocidade</p>'
            }
            res.innerHTML += '<p>Diriga sempre com cinto de segurança</p>'
        }
    </script>
</body>
</html>
